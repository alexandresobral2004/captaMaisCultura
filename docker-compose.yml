services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: captadb
      POSTGRES_USER: capta
      POSTGRES_PASSWORD: capta
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capta -d captadb"]
      interval: 5s
      timeout: 5s
      retries: 10
